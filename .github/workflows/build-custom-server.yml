name: Build custom Immich server image

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: "Immutable GHCR tag, e.g. v3.2.2-tz.1"
        required: true
        default: "v3.2.2-tz.1"
        type: string

permissions: {}

concurrency:
  group: custom-server-image-${{ inputs.imageTag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish immich-server
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate requested image tag
        env:
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_TAG}" =~ ^v3\.2\.2-tz\.[1-9][0-9]*$ ]]; then
            echo "imageTag must match v3.2.2-tz.N" >&2
            exit 1
          fi

      - name: Check out the requested source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Assert the v3.2.2 source and patch scope
        run: |
          set -euo pipefail
          test "$(node -p "require('./server/package.json').version")" = "3.2.2"

          changedServerFiles="$(git diff --name-only v3.2.2...HEAD -- server)"
          test "${changedServerFiles}" = "server/src/services/metadata.service.ts"

          git diff --check v3.2.2...HEAD -- server/src/services/metadata.service.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing image tag
        env:
          IMAGE: ghcr.io/alwaysbesideyou/immich-server
          IMAGE_TAG: ${{ inputs.imageTag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image ${IMAGE}:${IMAGE_TAG}" >&2
            exit 1
          fi

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/alwaysbesideyou/immich-server:${{ inputs.imageTag }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=ghcr.io/alwaysbesideyou/immich-server:${{ inputs.imageTag }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report immutable deployment reference
        run: |
          echo "Published: ghcr.io/alwaysbesideyou/immich-server:${{ inputs.imageTag }}" >> "$GITHUB_STEP_SUMMARY"
